plugins {
    id 'java'
    id 'application'
}

group = 'org.srdr'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.anastaciocintra:escpos-coffee:4.1.0'
    implementation 'com.sun.net.httpserver:http:20070405'

    // 🔹 Jackson (OBLIGATOIRE avec version)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
}


// Sources en UTF-8 : sous Windows, javac lit par defaut en windows-1252 et
// echoue sur les caracteres accentues ("unmappable character").
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'agent.PrintAgentApp'
}
